# Infraestrutura como código (Render Blueprint)
services:
  - type: web
    name: caixa-moradores
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false        # o deploy é disparado pelo GitHub Actions (deploy.yml)
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: caixa-db
          property: connectionString

databases:
  - name: caixa-db
    plan: free
    databaseName: caixa
    user: caixa_app
